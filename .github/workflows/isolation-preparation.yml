name: Isolation preparation metadata (NOT proof)

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    name: Metadata only - no containers or isolation proof
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GOTOOLCHAIN: local
      TMPDIR: ${{ github.workspace }}/.git/ci-trust-preflight-tmp
    steps:
      - name: Check out owned source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Prepare explicit owned scratch and empty Docker client configuration
        run: mkdir -p .git/ci-trust-preflight-tmp .git/ci-trust-preflight-empty
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.x'
          cache: false
      - name: Test metadata helper against owned fake Docker only
        run: go test -count=1 -v ./internal/cipreflight
      - name: Collect allowlisted metadata - NEVER execution consent or isolation proof
        run: go run ./internal/cipreflight
