name: Portable Go tests

'on':
  push:
    branches: [main, 'feat/mvp-public-driven']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.x'
          cache: false
      - name: Record observed toolchain
        run: go version
      - name: Run owned unit and public CLI tests
        env:
          CI_TRUST_NATIVE_ARTIFACT_DIR: ${{ runner.temp }}/ci-trust-native
        run: go test -count=1 -v ./...
      - name: Vet owned source
        run: go vet ./...
      - name: Retain native tested archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-trust-native-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-trust-native/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
